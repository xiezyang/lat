name: Request LAT CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open pull request number in the selected target repository"
        required: true
        type: string
      target_repository:
        description: "PR target: xiezyang/lat for a fork-only PR, or lat-opensource/lat"
        required: true
        type: choice
        default: lat-opensource/lat
        options:
          - xiezyang/lat
          - lat-opensource/lat
      test_request:
        description: 'Optional JSON, e.g. {"schema_version":1,"suites":[{"suite_key":"spec2000","parameters":{"input_size":"ref","runs_per_invocation":3,"test_set":"197","times":2,"performance_analysis":true},"environment":{"LATX_AOT":"0"}}]}'
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: request-lat-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve-pr:
    name: Resolve the pull request
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_dispatch: ${{ steps.resolve.outputs.should_dispatch }}
      source_repository_id: ${{ steps.resolve.outputs.source_repository_id }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      target_repository: ${{ steps.resolve.outputs.target_repository }}

    steps:
      - name: Find and validate the authoritative pull request
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_TARGET_REPOSITORY: ${{ github.repository }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
          MANUAL_TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          source = "xiezyang/lat"
          allowed_targets = (source, "lat-opensource/lat")
          event_name = os.environ["EVENT_NAME"]
          branch = os.environ["BRANCH_NAME"]

          def get_json(path, query=None):
              url = f"https://api.github.com/{path}"
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              request = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "lat-ci-request"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          if event_name == "pull_request":
              value = os.environ["PR_EVENT_NUMBER"].strip()
              if not re.fullmatch(r"[1-9][0-9]*", value):
                  raise SystemExit("pull_request event does not contain a valid PR number")
              pr_number = int(value)
              target = os.environ["PR_EVENT_TARGET_REPOSITORY"].strip()
              if target != source:
                  raise SystemExit("pull_request target_repository must be xiezyang/lat")
          elif event_name == "push":
              target = "lat-opensource/lat"
              matches = get_json(f"repos/{target}/pulls", {"state": "open", "head": f"xiezyang:{branch}", "per_page": "2"})
              if not isinstance(matches, list) or len(matches) != 1:
                  print(f"No unique open {target} PR for xiezyang:{branch}; CI request skipped.")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      print("should_dispatch=false", file=output)
                  raise SystemExit(0)
              pr_number = matches[0].get("number")
          else:
              value = os.environ["MANUAL_PR_NUMBER"].strip()
              if not re.fullmatch(r"[1-9][0-9]*", value):
                  raise SystemExit("pr_number must be a positive integer")
              pr_number = int(value)
              target = os.environ["MANUAL_TARGET_REPOSITORY"].strip()
              if target not in allowed_targets:
                  raise SystemExit(f"target_repository must be one of: {', '.join(allowed_targets)}")

          pr = get_json(f"repos/{target}/pulls/{pr_number}")
          head = pr.get("head") if isinstance(pr, dict) else None
          base = pr.get("base") if isinstance(pr, dict) else None
          head_repo = head.get("repo") if isinstance(head, dict) else None
          base_repo = base.get("repo") if isinstance(base, dict) else None
          if not isinstance(head_repo, dict) or head_repo.get("full_name") != source:
              raise SystemExit("The PR head must be xiezyang/lat")
          if not isinstance(base_repo, dict) or base_repo.get("full_name") != target:
              raise SystemExit("The PR base repository does not match target_repository")
          if pr.get("state") != "open":
              raise SystemExit("The PR must be open")
          if event_name == "push" and head.get("ref") != branch:
              raise SystemExit("The PR head no longer matches the pushed branch")
          values = {
              "should_dispatch": "true",
              "source_repository_id": str(head_repo["id"]),
              "pr_number": str(pr["number"]),
              "head_sha": str(head["sha"]),
              "base_sha": str(base["sha"]),
              "head_ref": str(head["ref"]),
              "target_repository": target,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  print(f"{key}={value}", file=output)
          print(f"Resolved {target} PR #{pr['number']} at {head['sha']}")
          PY

  dispatch-lat-ci-hub:
    name: Start LAT CI suite selection
    needs: resolve-pr
    if: needs.resolve-pr.outputs.should_dispatch == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the lat-ci-hub workflow
        env:
          DISPATCH_TOKEN: ${{ secrets.LAT_CI_HUB_DISPATCH_TOKEN }}
          REQUEST_KIND: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic-pr' }}
          SOURCE_REPOSITORY_ID: ${{ needs.resolve-pr.outputs.source_repository_id }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
          HEAD_REF: ${{ needs.resolve-pr.outputs.head_ref }}
          TARGET_REPOSITORY: ${{ needs.resolve-pr.outputs.target_repository }}
          TEST_REQUEST: ${{ inputs.test_request }}
          REQUESTER: ${{ github.actor }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "LAT_CI_HUB_DISPATCH_TOKEN is not configured in xiezyang/lat Actions secrets." >&2
            exit 1
          fi
          payload=$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "ref": "master",
              "inputs": {
                  "request_kind": os.environ["REQUEST_KIND"],
                  "source_repository": "xiezyang/lat",
                  "source_repository_id": os.environ["SOURCE_REPOSITORY_ID"],
                  "target_repository": os.environ["TARGET_REPOSITORY"],
                  "pr_number": os.environ["PR_NUMBER"],
                  "head_sha": os.environ["HEAD_SHA"],
                  "base_sha": os.environ["BASE_SHA"],
                  "head_ref": os.environ["HEAD_REF"],
                  "test_request": os.environ["TEST_REQUEST"],
                  "requester": os.environ["REQUESTER"],
              },
          }))
          PY
          )
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            https://api.github.com/repos/xiezyang/lat-ci-hub/actions/workflows/lat-ci-request.yml/dispatches
