name: Request LAT CI

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open pull request number in lat-opensource/lat"
        required: true
        type: string
      requested_suite_keys:
        description: "Optional comma-separated extra suites, for example spec2000/164-gzip"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve-upstream-pr:
    name: Resolve the upstream pull request
    runs-on: ubuntu-latest
    outputs:
      should_dispatch: ${{ steps.resolve.outputs.should_dispatch }}
      source_repository_id: ${{ steps.resolve.outputs.source_repository_id }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}

    steps:
      - name: Find and validate the authoritative upstream pull request
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          upstream = "lat-opensource/lat"
          source = "xiezyang/lat"
          event_name = os.environ["EVENT_NAME"]
          branch = os.environ["BRANCH_NAME"]

          def get_json(path, query=None):
              url = f"https://api.github.com/{path}"
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              request = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "lat-ci-request"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          if event_name == "push":
              matches = get_json(f"repos/{upstream}/pulls", {"state": "open", "head": f"xiezyang:{branch}", "per_page": "2"})
              if not isinstance(matches, list) or len(matches) != 1:
                  print(f"No unique open upstream PR for xiezyang:{branch}; CI request skipped.")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      print("should_dispatch=false", file=output)
                  raise SystemExit(0)
              pr_number = matches[0].get("number")
          else:
              value = os.environ["MANUAL_PR_NUMBER"].strip()
              if not re.fullmatch(r"[1-9][0-9]*", value):
                  raise SystemExit("pr_number must be a positive integer")
              pr_number = int(value)

          pr = get_json(f"repos/{upstream}/pulls/{pr_number}")
          head = pr.get("head") if isinstance(pr, dict) else None
          base = pr.get("base") if isinstance(pr, dict) else None
          head_repo = head.get("repo") if isinstance(head, dict) else None
          base_repo = base.get("repo") if isinstance(base, dict) else None
          if not isinstance(head_repo, dict) or head_repo.get("full_name") != source:
              raise SystemExit("The upstream PR head must be xiezyang/lat")
          if not isinstance(base_repo, dict) or base_repo.get("full_name") != upstream:
              raise SystemExit("The upstream PR base must be lat-opensource/lat")
          if pr.get("state") != "open":
              raise SystemExit("The upstream PR must be open")
          if event_name == "push" and head.get("ref") != branch:
              raise SystemExit("The upstream PR head no longer matches the pushed branch")
          values = {
              "should_dispatch": "true",
              "source_repository_id": str(head_repo["id"]),
              "pr_number": str(pr["number"]),
              "head_sha": str(head["sha"]),
              "base_sha": str(base["sha"]),
              "head_ref": str(head["ref"]),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  print(f"{key}={value}", file=output)
          print(f"Resolved upstream PR #{pr['number']} at {head['sha']}")
          PY

  dispatch-lat-ci-hub:
    name: Start LAT CI suite selection
    needs: resolve-upstream-pr
    if: needs.resolve-upstream-pr.outputs.should_dispatch == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the lat-ci-hub workflow
        env:
          DISPATCH_TOKEN: ${{ secrets.LAT_CI_HUB_DISPATCH_TOKEN }}
          REQUEST_KIND: ${{ github.event_name == 'push' && 'automatic-pr' || 'manual' }}
          SOURCE_REPOSITORY_ID: ${{ needs.resolve-upstream-pr.outputs.source_repository_id }}
          PR_NUMBER: ${{ needs.resolve-upstream-pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve-upstream-pr.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve-upstream-pr.outputs.base_sha }}
          HEAD_REF: ${{ needs.resolve-upstream-pr.outputs.head_ref }}
          REQUESTED_SUITE_KEYS: ${{ inputs.requested_suite_keys }}
          REQUESTER: ${{ github.actor }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "LAT_CI_HUB_DISPATCH_TOKEN is not configured in xiezyang/lat Actions secrets." >&2
            exit 1
          fi
          payload=$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "ref": "master",
              "inputs": {
                  "request_kind": os.environ["REQUEST_KIND"],
                  "source_repository": "xiezyang/lat",
                  "source_repository_id": os.environ["SOURCE_REPOSITORY_ID"],
                  "pr_number": os.environ["PR_NUMBER"],
                  "head_sha": os.environ["HEAD_SHA"],
                  "base_sha": os.environ["BASE_SHA"],
                  "head_ref": os.environ["HEAD_REF"],
                  "requested_suite_keys": os.environ["REQUESTED_SUITE_KEYS"],
                  "requester": os.environ["REQUESTER"],
              },
          }))
          PY
          )
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            https://api.github.com/repos/xiezyang/lat-ci-hub/actions/workflows/lat-ci-request.yml/dispatches
